<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Coffee House Menu</title>
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/menu.css">
</head>
<body>
<header class="main-header">
    <div class="header-bar">
        <div class="header-logo">
            <a href="index.html">
                <img src="assets/images/header-logo.png" alt="header-logo">
            </a>
        </div>
        <nav class="main-nav">
            <ul class="main-nav-list">
                <li><a class="nav-item-link" href="index.html#favorite-coffee">Favorite coffee</a></li>
                <li><a class="nav-item-link" href="index.html#about">About</a></li>
                <li><a class="nav-item-link" href="index.html#mobile-app">Mobile app</a></li>
                <li><a class="nav-item-link" href="index.html#main-footer">Contact us</a></li>
            </ul>
        </nav>
        <div class="header-controls">
            <div class="theme-controls">
                <button class="light-theme-button">
                    <img src="assets/icons/light-coffee-icon.png" alt="light-coffee-icon">
                </button>
                <button class="dark-theme-button">
                    <img src="assets/icons/dark-coffee-icon.png" alt="dark-coffee-icon">
                </button>
            </div>
            <div class="menu-controls">
                <a class="menu-link active" href="menu.html">Menu
                    <img src="assets/icons/coffee-cup-icon.png" alt="coffee-cup-icon">
                </a>
            </div>
        </div>
    </div>
</header>
<main>
    <section class="menu-offer">
        <h1 class="menu-offer__title">Behind each of our cups hides an <span>amazing surprise</span></h1>
        <div class="menu-offer__controls">
            <button class="menu-offer__button menu-offer__coffee-button active">
                <span class="menu-offer__icon-wrapper">
                    <img src="assets/icons/menu/coffee.png" alt="coffee-icon">
                </span>
                Coffee
            </button>
            <button class="menu-offer__button menu-offer__tea-button">
                <span class="menu-offer__icon-wrapper">
                    <img src="assets/icons/menu/tea.png" alt="tea-icon">
                </span>
                Tea
            </button>
            <button class="menu-offer__button menu-offer__desert-button">
                <span class="menu-offer__icon-wrapper">
                    <img src="assets/icons/menu/desert.png" alt="desert-icon">
                </span>
                Desert
            </button>
        </div>
    </section>
</main>
<footer></footer>
</body>
</html>
