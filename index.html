<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Coffee House</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="main-header">
    <div class="header-bar">
        <div class="header-logo">
            <img src="assets/images/header-logo.png" alt="header-logo">
        </div>
        <nav class="main-nav">
            <ul class="main-nav-list">
                <li>Favorite coffee</li>
                <li>About</li>
                <li>Mobile app</li>
                <li>Contact us</li>
            </ul>
        </nav>
        <div class="header-controls">
            <div class="theme-controls">
                <button class="light-theme-button">
                    <img src="assets/icons/light-coffee-icon.png" alt="light-coffee-icon">
                </button>
                <button class="dark-theme-button">
                    <img src="assets/icons/dark-coffee-icon.png" alt="dark-coffee-icon">
                </button>
            </div>
            <div class="menu-controls">
                <button class="menu-button">Menu
                    <img src="assets/icons/coffee-cup-icon.png" alt="coffee-cup-icon">
                </button>
            </div>
        </div>
    </div>
    <div class="header-hero"></div>
</header>
<main class="main-content"></main>
<footer class="main-footer"></footer>
</body>
</html>
